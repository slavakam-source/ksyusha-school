<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7752bc"><title>Ксюшина школа — математика</title>
<style>
*{box-sizing:border-box}body{margin:0;font:18px system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#f8eafb,#e1f6ff);color:#28233e}main{max-width:650px;margin:auto;padding:18px}.card{background:white;border-radius:24px;padding:20px;box-shadow:0 10px 35px #8171a52b;margin-top:15px}h1{font-size:24px;margin:0;color:#6246a9}h2{font-size:24px}.small{font-size:13px;color:#736c88}.teacher{background:#f2edff;border-radius:18px;padding:18px;line-height:1.5;margin:15px 0}.hero{font-size:48px;text-align:center;margin:12px}.progress{height:10px;background:#eee9f9;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;background:#9470d6;transition:width .3s}button{font-size:17px;font-weight:700;background:#7957c7;color:white;border:0;border-radius:14px;padding:13px 16px;margin:5px 3px 5px 0;min-height:48px;cursor:pointer}button.secondary{background:#ebe6fa;color:#58409e}button.choice{display:block;width:100%;text-align:left;background:#ebe6fa;color:#3d2c6d}input{width:100%;border:2px solid #d4c5ef;border-radius:14px;font-size:21px;padding:14px}#feedback{border-radius:14px;padding:12px;line-height:1.5}#feedback:not(:empty){background:#e9f6ed;margin-top:10px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.math{display:flex;justify-content:space-between;align-items:center;border-radius:12px;background:#e3f0ff;overflow:hidden;font-size:19px;font-weight:700}.math span{padding:10px}.math b{background:#fce9a0;padding:12px}.slots{display:flex;justify-content:space-around;gap:4px;flex-wrap:wrap}.slot{border:1px solid #d7c8eb;padding:7px;border-radius:10px;text-align:center;min-width:42px}.hidden{display:none}.footer{font-size:12px;color:#70678b;text-align:center;margin-top:17px}
</style></head><body><main><h1>✨ Ксюшина школа</h1><div class="small">🔒 Только математика · задания № 6 и № 7</div><section class="card"><div class="small" id="step"></div><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><div class="hero" id="hero">🌈👗</div><h2 id="title">Математический квест</h2><div class="teacher"><b>🤖 Чатик — помощник</b><p id="question"></p></div><div id="visual"></div><div id="choices"></div><div id="inputarea"><input id="answer" placeholder="Твой ответ" autocomplete="off"><button id="check">Проверить</button><button class="secondary" id="mic">🎙️ Ответить голосом</button></div><div><button id="voiceStart" class="secondary">🔊 Включить озвучивание</button> <span id="voiceStatus" class="small">Нажмите для включения звука</span></div><div id="help"><button class="secondary" id="hint">💡 Подсказка</button><button class="secondary" id="repeat">🔊 Повтори</button></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Продолжить ➜</button></section><div class="footer">Первая версия без подключения к ИИ. Голосовое чтение, ответы и подсказки подготовлены заранее. Для использования под наблюдением взрослого.</div></main>
<script>
(()=>{'use strict';
const cards=[['7 × 6','Е'],['9 + 7','П'],['91 − 78','Б'],['10 × 7','А'],['50 : 10','О'],['18 × 3','Д']];
const tasks=[
{title:'Ателье',q:'На четыре одинаковых платья ушло шестнадцать метров ткани. Что нужно сделать, чтобы узнать расход на одно платье?',options:['Разделить ткань поровну','Умножить число метров'],correct:0,hints:['Все платья одинаковые, а ткань — общая.','Нужно распределить общую длину ткани на четыре равные части.']},
{title:'Одно платье',q:'Сколько метров ткани нужно на одно платье, если на четыре платья ушло шестнадцать метров?',answer:'4',hints:['Раздели шестнадцать на четыре одинаковые части.','Какое число при умножении на четыре даёт шестнадцать?']},
{title:'Новый заказ',q:'Сколько таких же платьев можно сшить из двадцати метров ткани?',answer:'5',hints:['Вспомни расход на одно платье.','Сколько отрезков по четыре метра получится из двадцати?']},
{title:'Большой заказ',q:'А сколько таких же платьев можно сшить из сорока метров ткани?',answer:'10',hints:['Расход ткани на одно платье не меняется.','Сорок — это два раза по двадцать. Что станет с числом платьев?']},
...[16,5,13,42,54,70].map((n,i)=>({title:'Тайное слово — буква '+(i+1),q:'Найди карточку с результатом '+n+'. Какая буква написана на ней?',answer:'ПОБЕДА'[i],cards:true,hints:[['Посмотри на примеры со сложением.','Вычисли девять плюс семь.'],['Посмотри на примеры с делением.','Сколько десяток в пятидесяти?'],['Найди разность двух чисел.','Сколько будет девяносто один минус семьдесят восемь?'],['Вспомни таблицу умножения на семь.','Сколько будет семь раз по шесть?'],['Ищи умножение на три.','Посчитай восемнадцать три раза.'],['Вспомни умножение на десять.','Сколько будет десять раз по семь?']][i]}))
];
const $=id=>document.getElementById(id);let index=-1,errors=0,hintCount=0,hintIndex=0,stats=[],solved=false;
let voiceWanted=false;
function voiceStatus(t){const el=document.getElementById('voiceStatus');if(el)el.textContent=t}
function say(t){
if(!('speechSynthesis' in window)){voiceStatus('Озвучивание не поддерживается этим браузером');return}
try{
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(t);
u.lang='ru-RU';u.rate=.88;u.volume=1;
const voices=speechSynthesis.getVoices();
const ru=voices.find(v=>v.lang.toLowerCase()==='ru-ru')||voices.find(v=>v.lang.toLowerCase().startsWith('ru'));
if(ru)u.voice=ru;
u.onstart=()=>voiceStatus('🔊 Чатик говорит');
u.onend=()=>voiceStatus('🔊 Слушать вопрос');
u.onerror=()=>voiceStatus('Проверьте громкость и нажмите «Слушать вопрос»');
speechSynthesis.speak(u);
}catch(e){voiceStatus('Не удалось включить озвучивание')}
}
function startVoice(){voiceWanted=true;const s=index>=0&&index<tasks.length?tasks[index].q:document.getElementById('question').textContent;say(s)}

function feedback(t){$('feedback').textContent=t;say(t)}
function render(){solved=false;$('feedback').textContent='';$('next').classList.add('hidden');$('inputarea').classList.remove('hidden');$('help').classList.remove('hidden');$('choices').replaceChildren();$('visual').replaceChildren();$('bar').style.width=(Math.max(0,index)/tasks.length*100)+'%';
if(index===-1){$('step').textContent='Добро пожаловать';$('hero').textContent='🌈👗🔐';$('title').textContent='Математический квест';$('question').textContent='Привет, Ксюша! Мы будем помогать швейной мастерской и искать секретное слово. Я дам подсказку, если потребуется, но попробуй найти решение сама.';$('inputarea').classList.add('hidden');$('help').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent='Начать ➜';return}
if(index===tasks.length){$('step').textContent='Итоги';$('bar').style.width='100%';$('hero').textContent='🏆';$('title').textContent='Квест завершён!';$('question').textContent='Ты справилась! Расскажи взрослому, как ты рассуждала.';$('visual').textContent='Этапов: '+stats.length+'. Ошибочных попыток: '+stats.reduce((a,b)=>a+b.errors,0)+'. Подсказки использованы на '+stats.filter(x=>x.hints).length+' этапах. Секретное слово: ПОБЕДА.';$('inputarea').classList.add('hidden');$('help').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent='Начать снова ↻';return}
const t=tasks[index];$('step').textContent='Задание № '+(index<4?'6':'7')+' · этап '+(index+1)+' из '+tasks.length;$('hero').textContent=index<4?'👗🧵':'🔐🗝️';$('title').textContent=t.title;$('question').textContent=t.q;$('answer').value='';$('answer').inputMode=index<4?'numeric':'text';$('answer').placeholder=t.cards?'Введи букву':'Введи число';
if(t.cards){const wrap=document.createElement('div');wrap.className='cards';cards.forEach(([expression,letter])=>{const item=document.createElement('div');item.className='math';const e=document.createElement('span');e.textContent=expression;const l=document.createElement('b');l.textContent=letter;item.append(e,l);wrap.append(item)});$('visual').append(wrap);const slots=document.createElement('div');slots.className='slots';[16,5,13,42,54,70].forEach((v,i)=>{const el=document.createElement('div');el.className='slot';el.textContent=v+'\n'+(i<index-4?'ПОБЕДА'[i]:'🔒');slots.append(el)});$('visual').append(slots)}else $('visual').textContent='👗 👗 👗 👗';
if(t.options){$('inputarea').classList.add('hidden');t.options.forEach((choice,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>check(i);$('choices').append(b)})}
if(voiceWanted)say(t.q)}
function check(selected){if(solved||index<0||index>=tasks.length)return;const t=tasks[index];const value=t.options?selected:$('answer').value.trim().toUpperCase();if(value===''||value===undefined){feedback('Сначала попробуй ответить.');return}const ok=t.options?value===t.correct:value===t.answer;if(ok){solved=true;stats.push({errors,hints:hintCount});feedback('Правильно! А теперь объясни взрослому или мне, как ты рассуждала.');$('next').classList.remove('hidden');$('next').textContent='Дальше ➜';$('inputarea').classList.add('hidden');$('help').classList.add('hidden');$('choices').querySelectorAll('button').forEach(b=>b.disabled=true)}else{errors++;feedback('Попробуй ещё раз. '+t.hints[Math.min(hintIndex++,t.hints.length-1)])}}
$('check').onclick=()=>check();$('answer').onkeydown=e=>{if(e.key==='Enter')check()};$('next').onclick=()=>{index=index===tasks.length?-1:index+1;if(index===-1)stats=[];errors=0;hintCount=0;hintIndex=0;render()};$('hint').onclick=()=>{if(index>=0&&index<tasks.length){const t=tasks[index];hintCount++;feedback('Подсказка: '+t.hints[Math.min(hintIndex++,t.hints.length-1)])}};$('repeat').onclick=()=>startVoice();$('voiceStart').onclick=()=>{$('voiceStart').textContent='🔊 Слушать вопрос';startVoice()};
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){feedback('Распознавание речи недоступно в этом браузере. Используй микрофон на клавиатуре iPhone или iPad.');$('answer').focus();return}try{const r=new R();r.lang='ru-RU';r.onresult=e=>{$('answer').value=e.results[0][0].transcript;feedback('Проверь распознанный ответ, затем нажми «Проверить».')};r.onerror=()=>feedback('Микрофон не сработал. Попробуй диктовку на клавиатуре.');r.start()}catch(e){feedback('Не получилось включить микрофон. Используй клавиатуру.')}};
render()})();
</script></body></html>
